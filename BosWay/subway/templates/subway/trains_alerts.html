{% extends "subway/base.html" %}
{% load static %}

{% block extra_head %}
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
{% endblock extra_head %}

{% block content %}
    <section class="trains-page">
        <div class="trains-page__controls">
            <label class="trains-page__label" for="line-select">
                Subway line
            </label>
            <select id="line-select" name="line_name">
                <option value="">Select a subway line to display</option>
            </select>
        </div>
        <section
            id="alerts-panel"
            class="trains-page__alerts"
            aria-live="polite"
            hidden
        >
            <h2 class="trains-page__alerts-title">Service alerts</h2>
            <div id="alerts-content"></div>
        </section>
        <section class="trains-page__map-shell" aria-labelledby="trains-map-title">
            <div class="trains-page__map-copy">
                <p class="eyebrow">BosWay</p>
                <h1 id="trains-map-title" class="page-title">
                    trains &amp; alerts
                </h1>
                <p class="page-copy">
                    Select a subway line to load live alerts and route details.
                </p>
            </div>
            <div
                id="trains-map"
                class="trains-page__map"
                role="img"
                aria-label="Boston subway map display area"
            ></div>
        </section>
    </section>
{% endblock content %}

{% block page_scripts %}
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer
    ></script>
    <script
        src="{% static 'subway/js/map_styles.js' %}"
        defer
    ></script>
    <script
        src="{% static 'subway/js/trains_alerts.js' %}"
        defer
    ></script>
{% endblock page_scripts %}
