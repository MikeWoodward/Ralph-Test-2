{% extends "subway/base.html" %}

{% block title %}Trains &amp; Alerts — MBTA Subway{% endblock %}

{% block content %}
<div class="trains-alerts-page">
    <div class="controls-bar">
        <label for="line-select" class="line-label">Select a line:</label>
        <select id="line-select" class="line-select">
            <option value="">— Choose a line —</option>
        </select>
    </div>

    <div id="alerts-area" class="alerts-area">
        <p class="alerts-placeholder">Select a line to see alerts.</p>
    </div>

    <div id="map" class="map-container"></div>
</div>
{% endblock %}

{% block extra_scripts %}
{% load static %}
<script src="{% static 'subway/js/map_utils.js' %}"></script>
<script src="{% static 'subway/js/app.js' %}"></script>
{% endblock %}
