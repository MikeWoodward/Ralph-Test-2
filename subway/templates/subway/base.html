{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MBTA Subway{% endblock %}</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="{% static 'subway/css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav class="tab-bar">
            <a
                href="{% url 'trains_alerts' %}"
                class="tab {% if active_tab == 'trains' %}active{% endif %}"
            >Trains &amp; Alerts</a>
            <a
                href="{% url 'map_facilities' %}"
                class="tab {% if active_tab == 'map' %}active{% endif %}"
            >Map &amp; Facilities</a>
            <a
                href="{% url 'about' %}"
                class="tab {% if active_tab == 'about' %}active{% endif %}"
            >About</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="{% static 'subway/js/app.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
