{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MBTA Subway{% endblock %}</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- App CSS -->
    <link rel="stylesheet" href="{% static 'subway/css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">MBTA Subway</h1>
        <nav class="nav-tabs" role="navigation" aria-label="Main navigation">
            <a
                href="{% url 'subway:trains-alerts' %}"
                class="nav-tab {% if active_page == 'trains-alerts' %}nav-tab--active{% endif %}"
            >Trains &amp; Alerts</a>
            <a
                href="{% url 'subway:map-facilities' %}"
                class="nav-tab {% if active_page == 'map-facilities' %}nav-tab--active{% endif %}"
            >Map &amp; Facilities</a>
            <a
                href="{% url 'subway:about' %}"
                class="nav-tab {% if active_page == 'about' %}nav-tab--active{% endif %}"
            >About</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
